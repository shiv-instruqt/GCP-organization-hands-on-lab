version: "3"
containers:
- name: cloud-client
  image: gcr.io/instruqt/cloud-client
  shell: /bin/bash
  ports:
  - 80
  memory: 1024
gcp_projects:
# dev: where the developer identity (dev-alice) works
- name: northwinddev
  services:
  - cloudresourcemanager.googleapis.com
  - serviceusage.googleapis.com
  - iam.googleapis.com
  - iamcredentials.googleapis.com
  - storage.googleapis.com
  - policytroubleshooter.googleapis.com
  - orgpolicy.googleapis.com
  - artifactregistry.googleapis.com
  - run.googleapis.com
  regions:
  - us-central1
  # granted to BOTH the project's user and service account (platform admin, not owner/editor)
  roles:
  - roles/browser
  - roles/serviceusage.serviceUsageAdmin
  - roles/iam.serviceAccountAdmin
  - roles/iam.roleAdmin
  - roles/resourcemanager.projectIamAdmin
  - roles/iam.securityReviewer
  - roles/storage.admin
# staging: where the deployment pipeline (ci-deployer) deploys
- name: northwindstaging
  services:
  - cloudresourcemanager.googleapis.com
  - serviceusage.googleapis.com
  - iam.googleapis.com
  - iamcredentials.googleapis.com
  - storage.googleapis.com
  - policytroubleshooter.googleapis.com
  - orgpolicy.googleapis.com
  - artifactregistry.googleapis.com
  - run.googleapis.com
  regions:
  - us-central1
  roles:
  - roles/browser
  - roles/serviceusage.serviceUsageAdmin
  - roles/iam.serviceAccountAdmin
  - roles/iam.roleAdmin
  - roles/resourcemanager.projectIamAdmin
  - roles/iam.securityReviewer
